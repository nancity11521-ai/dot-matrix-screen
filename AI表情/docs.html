<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点阵屏项目 · 需求规格说明文档 (表格展示版)</title>
  <style>
    :root {
      --bg: #070b0f;
      --panel: #0d141a;
      --panel-border: #1e2a35;
      --card-bg: #121c24;
      --accent: #ffd45e;
      --accent-glow: rgba(255, 212, 94, 0.4);
      --text: #e6edf3;
      --muted: #8b9baa;
      --dim: #485764;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% -10%, #15222c 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 20, 26, 0.95);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: #141f28;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #1e2c38; border-color: var(--accent); }

    .brand-title h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 212, 94, 0.12);
      border: 1px solid rgba(255, 212, 94, 0.3);
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-switch-group {
      display: flex;
      background: #090e13;
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--panel-border);
      margin-right: 6px;
    }

    .btn {
      padding: 6px 13px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: #15202a;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { background: #1e2c38; border-color: #3b5062; }
    .btn.active {
      background: rgba(255, 212, 94, 0.18);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
      box-shadow: 0 0 10px rgba(255, 212, 94, 0.2);
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1116;
      font-weight: 700;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* 主内容区 */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .editor-container {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 150px);
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #0d151c;
      border-bottom: 1px solid var(--panel-border);
      font-size: 12.5px;
      color: var(--muted);
    }

    .tip-highlight {
      color: #7dd3fc;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 文本编辑框 (源码模式) */
    #docEditor {
      display: none;
      width: 100%;
      flex: 1;
      min-height: 750px;
      background: #090e13;
      border: none;
      outline: none;
      padding: 26px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", sans-serif;
      font-size: 13.5px;
      line-height: 1.7;
      resize: vertical;
      white-space: pre-wrap;
    }

    /* 真实表格展示容器 (默认模式) */
    #docPreview {
      display: block;
      padding: 34px 42px;
      color: var(--text);
      line-height: 1.8;
      font-size: 14px;
      outline: none;
    }

    /* 表格展示模式下标题与排版样式 */
    #docPreview h1 {
      font-size: 26px;
      color: var(--accent);
      border-bottom: 2px solid var(--panel-border);
      padding-bottom: 14px;
      margin-bottom: 22px;
      letter-spacing: 0.02em;
    }
    #docPreview h2 {
      font-size: 19px;
      color: #7dd3fc;
      margin-top: 36px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(125, 211, 252, 0.2);
      padding-bottom: 8px;
    }
    #docPreview h3 {
      font-size: 16px;
      color: #f1f5f9;
      margin-top: 26px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #docPreview h4 {
      font-size: 14px;
      color: #ffd45e;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    #docPreview p { margin-bottom: 14px; color: #cbd5e1; }
    #docPreview ul, #docPreview ol { margin-left: 24px; margin-bottom: 16px; color: #cbd5e1; }
    #docPreview li { margin-bottom: 6px; }
    #docPreview code {
      background: #1a2530;
      padding: 2px 7px;
      border-radius: 4px;
      color: #f6ad55;
      font-family: monospace;
      font-size: 12.5px;
    }
    #docPreview pre {
      background: #090e13;
      border: 1px solid var(--panel-border);
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
    }
    #docPreview pre code { background: none; padding: 0; color: #93c5fd; }
    #docPreview blockquote {
      border-left: 4px solid var(--accent);
      padding: 10px 18px;
      background: rgba(255, 212, 94, 0.08);
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
      color: #f8fafc;
      font-size: 13.5px;
    }
    #docPreview hr {
      border: none;
      border-top: 1px solid var(--panel-border);
      margin: 30px 0;
    }

    /* 真实表格 (Real HTML Grid Tables) 高保真样式 */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
      margin-bottom: 26px;
      border-radius: 10px;
      border: 1.5px solid #223548;
      background: #0b131a;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }
    #docPreview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.65;
    }
    #docPreview th, #docPreview td {
      border: 1px solid #1c2b3a;
      padding: 11px 15px;
      vertical-align: middle;
    }
    #docPreview th {
      background: #142230;
      color: var(--accent);
      font-weight: 700;
      font-size: 13.5px;
      white-space: nowrap;
      border-bottom: 2px solid rgba(255, 212, 94, 0.4);
      letter-spacing: 0.02em;
    }
    #docPreview tr:nth-child(even) td {
      background: #0e1722;
    }
    #docPreview tr:hover td {
      background: #192837;
    }
    #docPreview td:focus, #docPreview th:focus {
      outline: 2px solid var(--accent);
      background: #1c2f42 !important;
      border-radius: 4px;
    }

    /* 浮动提示 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #192733;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 9px 24px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="brand">
      <a href="index.html" class="back-btn">← 返回点阵屏模拟器</a>
      <div class="brand-title">
        <h1>点阵屏项目 · 需求规格说明文档</h1>
      </div>
      <div class="status-badge" id="saveStatus">
        <span class="status-dot"></span>
        <span id="saveStatusText">已实时自动保存</span>
      </div>
    </div>

    <div class="toolbar-actions">
      <div class="mode-switch-group">
        <button class="btn active" id="btnPreviewMode" style="border:none" onclick="setMode('preview')">📊 表格展示与直接编辑 (默认)</button>
        <button class="btn" id="btnEditMode" style="border:none" onclick="setMode('edit')">📝 Markdown源码模式</button>
      </div>
      <button class="btn primary" onclick="manualSave()">💾 保存文档</button>
      <button class="btn" onclick="copyDocument()">📋 一键复制全文</button>
      <button class="btn" onclick="exportMarkdown()">📥 导出 .md 文件</button>
      <button class="btn" onclick="resetToDefaultTemplate()">🔄 恢复默认标准模板</button>
    </div>
  </header>

  <!-- 主编辑区 -->
  <main>
    <div class="editor-container">
      <div class="editor-header">
        <span class="tip-highlight" id="modeTip">
          ✨ 当前为【表格展示模式】—— 页面所有需求与参数已全部渲染为表格。您可以直接点击任意表格单元格进行修改打字，自动保存至本地！
        </span>
        <span id="wordCount">字数: 0</span>
      </div>

      <!-- 真实表格展示容器 (默认可见，支持直接点击单元格打字修改) -->
      <div id="docPreview" contenteditable="true" spellcheck="false"></div>

      <!-- 纯文本编辑框 (仅在切换源码模式时展示) -->
      <textarea id="docEditor" spellcheck="false" placeholder="在此直接编辑您的需求文档 Markdown 源码..."></textarea>
    </div>
  </main>

  <div class="toast" id="toast">操作已完成！</div>

  <script>
    const DEFAULT_TEMPLATE = "# 点阵屏项目 · 需求规格说明书 (通俗易懂全功能版)\n\n> **文档版本**：v3.0.0 (传音 Infinix Note 60 Pro Active Matrix 原厂动态效果套件 · 120款动画全量清单总览)\n> **项目名称**：点阵屏项目（AI 表情与全场景动画系统）  \n> **负责人**：南城  \n> **屏幕设备**：直径 20 毫米的超小圆形发光屏（内置 393 颗微型发光小灯珠）  \n> **最后修订日期**：2026-11-16\n\n---\n\n## 1. 这是一个什么产品？（通俗介绍与核心看点）\n\n本项目是为一款**像硬币一样小巧的圆形发光屏幕**量身打造的互动系统。整个屏幕只有大约 2 厘米宽，却密密麻麻排列着 **393 颗米粒大小的微型发光小灯珠**。\n\n我们打破了传统点阵屏只能显示呆板数字的限制，把生动活泼的 **AI 仿生灵动表情包**、**实用时钟与电量表盘**、**运动健身打卡**、**天气变化** 以及 **节日温馨氛围灯** 共 **5 大分类、106 款动画** 融为一体，并且对每一款动画都进行了**规范化永久编号（#01 ~ #106）**。\n\n### 左右双屏同步对比（大白话说明）\n\n网页上设计了两个圆盘，左边是小灯珠发光的实际效果，右边是普通手机/电脑上的高清顺滑效果。两者是**分秒不差、实时同步**的：\n\n| 对比维度 | 左视窗：点阵发光屏 | 右视窗：普通高清屏 | 为什么这么做？ |\n| :--- | :--- | :--- | :--- |\n| **画面长什么样** | 由 393 颗微型暖黄小灯珠组成，带有复古科技感与柔和微光光晕 | 顺滑无噪点的高清矢量彩色画面，细腻展示所有动态细节 | 一眼看出实际做成小圆屏是什么效果 |\n| **谁最适合看** | 硬件工程师、想要看真实设备发光质感的用户 | 动画设计师、喜欢看细腻顺滑动画的普通用户 | 满足不同人群的审阅需求，开发与设计两不误 |\n| **动作同步情况** | 只要右边在动，左边的小灯珠就以**完全相同的节奏和帧率**跟着动 | 只要左边调进度，右边的画面也**完全同步**跳转到对应位置 | 绝不出现两边动作各走各、节奏对不上的情况 |\n| **滑块调节联动** | 拖动左边的电量、音量、温度滑块，左边点阵立即改变 | 拖动左边的电量、音量、温度滑块，右边高清仪表同步刷新 | 全链路联动，测试硬件时不用反复刷新页面 |\n\n---\n\n## 2. 硬件长什么样？（外观与规格参数大白话表）\n\n### 2.1 屏幕硬件规格说明表\n\n| 硬件指标 | 说明与通俗解释 | 实际参数 / 规格 |\n| :--- | :--- | :--- |\n| **屏幕整体大小** | 整个发光圆盘的直径，和日常用的一元硬币大小基本一致 | 直径 20 毫米 (2.0 cm) |\n| **发光小灯总数** | 屏幕上一共由多少颗独立可控的发光灯珠组成 | **393 颗微型发光灯珠** |\n| **排布形状** | 23 行对称圆盘排列，中间最宽，上下两端平缓收窄为圆弧 | 最多一行 23 颗灯，最少一行 5 颗灯 |\n| **小灯之间的距离** | 相邻两颗小灯珠中心之间的微小缝隙，排列极其致密 | 0.16 毫米（肉眼看去细腻柔和） |\n| **默认发光颜色** | 经典温暖的复古麦金黄光，温润不刺眼 | 暖金黄光（在网页上可随心换成其他颜色） |\n| **发光亮度与光晕** | 小灯珠支持无级渐变调光，周围带有通透的柔和微光 | 20% ~ 100% 亮度可调，支持呼吸光晕 |\n| **中心对齐基准** | 整个屏幕正中间的小圆心，所有旋转和缩放动画都以此为中心 | 处于第 11 行、第 11 列的中心灯珠 |\n\n### 2.2 393 颗灯珠在圆盘上的排布分布表\n\n屏幕不是四四方方的矩形，而是一个正圆形。23 行从上到下的灯珠分布如下：\n\n| 所在行数 | 所在圆盘位置 | 该行小灯珠数量 | 视觉排列效果说明 |\n| :---: | :--- | :---: | :--- |\n| **第 00 行** | 屏幕最顶端边缘 | 5 颗 | 顶部小圆弧切线，收拢边缘 |\n| **第 01 行** | 顶部上边缘过渡 | 9 颗 | 顺滑弧形向下拓宽 |\n| **第 02 行** | 上部前段 | 13 颗 | 弧形继续自然扩展 |\n| **第 03 行** | 上部中段 | 15 颗 | 接近大半宽度 |\n| **第 04 行** | 上部后段 | 17 颗 | ，直接基于官方心跳、时钟、雷达底稿进行修改涂鸦 |\n| **⏱️ 多帧时间轴管理** | 编辑器下方的帧数胶囊条（第 1 帧、第 2 帧...） | 点击「📋 复制帧」可将当前画好的图案直接复制到下一帧微调（做动画最省时省力）；点击「➕ 加帧」增加空白帧；点击「🗑️ 删帧」删除多余帧 | 制作连续流畅的动态画面，让图案动起来、旋转或缩放 |\n| **👀 实时循环播放预览** | 编辑器右侧的「动效预览」小圆窗 | 在您涂抹点阵的同时，右侧小窗口以您设定的帧率自动循环播放多帧动画效果，支持一键播放/暂停 | 边画边看效果，随时调整节奏与画面连贯度 |\n| **💾 保存修改并应用** | 编辑器右下角高亮「💾 保存修改并应用」按钮 | 将所有修改立即更新到动画库并应用到双屏播放器，**自动持久化保存到浏览器存储空间**，关掉网页或刷新绝不丢失 | 创作完成后的常规保存 |\n| **📋 另存为新动画** | 编辑器底部点击「📋 另存为新动画」按钮 | 不覆盖原有动画，自动创建一个新的编号副本（如 #88 副本），保留原动画的同时新增一款 | 既想保留官方经典图案，又想保留自己魔改版本的双赢操作 |\n| **🗑️ 安全删除动画** | 鼠标移到动画卡片点击「🗑️」，或在编辑器内点击「🗑️ 删除此动画」 | 弹出防误触二次确认窗口，确认后将动画从系统列表中完全移除，播放器自动顺延到下一个动画 | 删掉不喜欢的动画或临时草稿，让列表更清爽干净 |\n| **🔄 一键恢复官方预设** | 点击右侧栏上方的「🔄 恢复预设」按钮 | 一键清除所有误操作或乱修改，**完美找回官方初始的全部 83 款动画** | 不小心删错动画、或者改乱了想彻底推倒重来时，随时一键还原，安全无后顾之忧 |\n| **💾 备份与导入 JSON** | 点击「💾 备份」下载 .json 文件；点击「📥 导入」选择文件 | 将您的所有自定义动画与图案导出为单个备份文件保存在电脑中，或者在其他电脑浏览器上一键导入共享 | 换电脑、分享给朋友或者做好完整的数据归档 |\n\n### 4.2 393 点阵画板工具与快捷操作说明表\n\n| 画板工具 | 图标 | 通俗操作方式 | 效果说明 |\n| :--- | :---: | :--- | :--- |\n| **画笔工具** | 🖌️ | 鼠标左键点击或按住拖拽 | 滑过的所有点阵灯珠立即点亮发光，外围带有真实柔光 |\n| **橡皮擦工具** | 🧹 | 鼠标左键点击或按住拖拽 | 滑过的所有点阵灯珠立即熄灭，恢复纯黑底色 |\n| **反转点阵** | 🌓 | 单击按钮 | 当前帧所有亮着的灯全部熄灭，原本熄灭的灯全部点亮（明暗反相） |\n| **全亮模式** | 💡 | 单击按钮 | 一键将整块屏幕的 393 颗灯珠全部点亮，相当于全屏手电筒底板 |\n| **清空画板** | 🗑️ | 单击按钮 | 一键熄灭当前帧的所有灯珠，快速获得一张干净的黑底画布 |\n| **复制此帧** | 📋 | 单击按钮 | 将当前帧的所有发光灯珠克隆到下一帧，适合快速制作连续微动动画 |\n| **上一帧 / 下一帧** | ⏮ / ⏭ | 单击按钮或直接点选数字胶囊 | 快速在不同帧之间来回切换检查细节 |\n| **帧率滑块** | ⏱️ | 输入 1 ~ 30 数字 | 调节动画播放快慢（如设为 8 适合慢速呼吸，设为 16 适合高速弹跳） |\n\n### 4.3 左右双屏与硬件数据同步机制\n\n| 模块 | 左侧 393 点阵发光屏 | 右侧普通高清屏 | 为什么这么设计？ |\n| :--- | :--- | :--- | :--- |\n| **自定义动画同步** | 真实呈现 393 颗物理小灯珠的点亮/熄灭分布 | 自动将涂抹的点阵图案升华为**超清矢量发光体（带高反差发光灯芯与环境泛光）** | 即使是普通用户涂抹的图案，也能在右侧大屏上以细腻柔和的高清矢量质感呈现，左右两边毫秒级同频循环 |\n| **数据持久化保障** | 本地 `localStorage` 安全存储，容量超大，无需联网登录即可长期永久保存 | 本地修改即时生效，绝不依赖远程服务器，断网也能自由创作 | 保护用户隐私，打开网页即用，响应飞快 |\n\n---\n\n## 5. 手机桌面小部件怎么用？（2×2 圆形小部件操作与说明表）\n\n为了让用户不用打开 App 就能在手机桌面上随时开关点阵屏，系统设计了 **2×2 圆形桌面小部件**。\n\n### 4.1 桌面小部件长什么样？\n- **占用空间**：占用手机桌面 4 个普通图标的位置（2行 × 2列），像一枚嵌在桌面上的小勋章。\n- **外观风格**：圆润的深色玻璃小圆盘，外圈有一圈细细的金属边框和呼吸发光环。\n- **状态变化**：\n  - **开机状态**：圆盘外圈亮起柔和的金黄微光，中心微缩显示点阵屏正在播放的图案。\n  - **关机休眠**：圆盘外圈变暗为哑光深灰色，中心显示一个小小的电源符号，表示正在极低功耗待机。\n\n### 4.2 小部件操作手势与反应对照表\n\n| 你怎么操作 | 具体动作要求 | 手机会发生什么 | 为什么这么设计？ |\n| :--- | :--- | :--- | :--- |\n| **轻点一下 (单击)** | 手指轻轻点击小部件圆盘 1 次 | **开关点阵屏**：如果屏幕开着就慢慢变暗关掉；如果是关着的就温柔亮起开机 | 最常用、最便捷的操作，不用进 App 就能一键开关 |\n| **按住不放 (长按)** | 手指按住小部件圆盘半秒钟（大约 0.5 秒） | **绝不会误关机**！手机会**轻轻震动一下**，然后直接打开**「点阵屏设置界面」** | 想调亮度、换动画时，长按直接进设置，顺手又防误触 |\n\n---\n\n## 6. 手机下拉控制中心怎么用？（3 个快捷按钮功能与联动表）\n\n在手机从屏幕右上角往下一划拉出来的“快捷开关面板”（控制中心）里，专门放了 3 个互不打扰的实用小按钮。\n\n### 5.1 控制中心的 3 个按钮功能说明表\n\n| 按钮名称 | 按钮上的小图标 | 点一下是干什么的？ | 和手机自己的闪光灯有什么关系？ |\n| :--- | :--- | :--- | :--- |\n| **【点阵屏开关】** | 一个圆圈点阵图标 | 打开或关闭点阵屏的电源 | **完全无关**。它只负责点阵屏开机或熄屏休息。 |\n| **【点阵屏手电筒】** | 手电筒旁边带很多小光点的图标 | **点阵屏 393 颗灯全开最亮照明！** 变成一个高亮、不刺眼的柔光小手电筒 | **重要规则**：打开时，控制中心里的手电筒图标会亮起提示您手电开了；**但是手机背后的刺眼闪光灯不亮**，完全靠点阵屏柔光照亮！ |\n| **【手机手电筒】** | 普通手机手电筒图标 | 打开手机背后自带的常规大闪光灯 | **重要规则**：**和点阵屏完全没有任何关系！** 点阵屏该放什么动画就继续放什么动画，绝不会莫名其妙被点亮或熄灭。 |\n\n### 5.2 按钮操作与实际效果对照表（通俗真值表）\n\n| 你在控制中心按了什么 | 点阵屏 393 颗小灯的表现 | 手机后背的自带闪光灯 | 控制中心手电筒图标 | 通俗原理与好处 |\n| :--- | :--- | :--- | :--- | :--- |\n| **按一下【点阵屏开关】** | 屏幕开机演动画，或者熄屏休眠 | 维持原有状态 (不亮) | 维持原有状态 | 方便快速开关点阵屏，省电又省心 |\n| **按一下【点阵屏手电筒】(开)** | **全部 393 颗小灯全亮，最亮泛光照明** | **不亮 (保持关闭)** | **高亮点亮** | 点阵屏面积大、光线柔和，当小夜灯既照得亮又绝不晃眼 |\n| **再按一下【点阵屏手电筒】(关)** | **自动恢复刚才在播的动画** | 维持关闭 | **熄灭变灰** | 照亮完毕后无缝回到刚才的表情或时钟画面 |\n| **按一下【手机手电筒】(开)** | **完全不变，继续演刚才的动画** | **点亮发光** | **高亮点亮** | 只开手机后背强光灯，绝不粗暴打断点阵屏的正常工作 |\n| **再按一下【手机手电筒】(关)** | **完全不变，继续演刚才的动画** | **熄灭关闭** | **熄灭变灰** | 只关手机后背强光灯，点阵屏完全不受任何打扰 |\n\n---\n\n## 7. 网页怎么操作？（网页界面功能大白话表）\n\n网页版是一个功能完整的在线调试与体验工作台，主要分为四个主要区域：\n\n| 页面区域 | 所在位置 | 里面有什么按钮和功能 | 普通用户怎么用？ |\n| :--- | :--- | :--- | :--- |\n| **顶部状态条** | 整个网页最上方 | 当前亮了多少颗小灯的计数（例如 186/393 亮起）、**「📝 需求说明文档」** 独立入口 | 随时看一眼灯珠亮起比例；点击需求文档在新标签页随时查看与修改本文档 |\n| **左侧控制面板** | 网页左边一栏 | 屏幕亮度滑动条、发光光晕大小滑动条、6款经典配色与彩虹取色器、模拟手机电量/音量/温度的滑块 | 调调自己喜欢的颜色和亮度；拉动电量滑块，看看电量低的时候电池表盘怎么变红 |\n| **中央核心展台** | 网页正中间 | **左边点阵屏、右边高清屏**、底部播放/暂停/单 lse)**：背面来电专属呼吸涟漪。中心高亮经典电话听筒倾斜 45 度振铃高频振颤，外围两道对称同心圆光环以波浪节奏扩散至 393 点阵外边缘，顶部伴随警示光标双闪。\n- **`INF_STUDIO_MSG` (#114 · INF-08 💬 灵动气泡 · 消息提醒)**：信封图标灵动展开为圆角对话气泡，气泡内部三颗微粒犹如打字指示器正弦律动弹跳，随后扩散出外扩柔和微光波。\n- **`INF_STUDIO_ALARM` (#115 · INF-09 ⏰ 摇摆闹钟 · 晨间唤醒)**：机械闹钟以 ±15 度左右高频晃摆，顶部双金属撞铃高频振颤，并向两侧上方发射弧形音浪声波震荡光纹。\n\n### 4.4 ✨ Matrix Studio 官方专属定制 (Matrix Studio · 5款)\n- **`INF_STUDIO_SIGNATURE` (#116 · INF-10 ✨ 跑马灯签名 · Studio Marquee)**：Note 60 Pro Matrix Studio 定制霓虹跑马灯，平滑匀速滚动跑马走字 "INFINIX NOTE 60 PRO (5G) · ACTIVE MATRIX"，带有优雅微光拖尾与上下微光边框点缀。\n- **`INF_STUDIO_MUSIC` (#117 · INF-11 🎵 矩阵律动 · Music Groove)**：XOS 音乐播放专属律动，8 组对称频段均衡器柱状图从圆心向外两侧跳动，重低音下沉时中心爆发全向冲击光环。\n- **`INF_STUDIO_EMOJI_COOL` (#118 · INF-12 😎 像素酷墨镜 · Cool Shades)**：官方预置潮酷像素墨镜表情，一道晶亮高光反光扫掠从左向右横穿两副镜片，嘴角扬起自信微笑。\n- **`INF_STUDIO_EMOJI_HEART` (#119 · INF-13 💖 像素灵动心 · Heart Pulse)**：大小双心嵌套跳动，双拍真实心跳节拍（咚-咚--咚-咚），心尖伴随脉冲微光扩散并迸发微星。\n- **`INF_STUDIO_WEATHER` (#120 · INF-14 ⛅ 灵动天气台 · Weather Matrix)**：金黄太阳旋转射出光芒，轻盈白云从右向左横穿飘拂，下方伴随三滴晶莹雨滴划落，集晴、阴、雨于一体的动态天气矩阵。\n\n---\n\n## 5. 全项目 120 款动画全量清单总览表（Master Animation Catalog）\n\n以下为本项目当前所包含的 **全部 120 款动画** 完整技术总清单（106 款通用项目基准 + 14 款传音 Note 60 Pro 原厂专属效果）：\n\n| 全局编号 | 分类代号 | 标识符 (ID) | 动画名称 | 图标 | 所属分类 / 子分类 | 帧数/时长 | 传音 Infinix 对应角色 (P0~P6) | 视觉特性简述 |\n| :---: | :---: | :--- | :--- | :---: | :--- | :---: | :--- | :--- |\n| **#01** | `EMO-01` | `neutre` | 平静 · 平常 | 🙂 | emotion / emotions | 3s | - | 仿生灵眸数学光线追踪，支持注视移动与自然生命呼吸 |\n| **#02** | `EMO-02` | `attentif` | 专注 · 凝视 | 🧐 | emotion / emotions | 3s | - | 仿生灵眸数学光线追踪，支持注视移动与自然生命呼吸 |\n| **#03** | `EMO-03` | `surpris` | 惊讶 · 震惊 | 😲 | emotion / emotions | 2.5s | - | 仿生灵眸数学光线追踪，支持注视移动与自然生命呼吸 |\n| **#04** | `EMO-04` | `excite` | 兴奋 · 雀跃 | 🤩 | emotion / emotions | 2.5s | - | 仿生灵眸数学光线追踪，支持注视移动与自然生命呼吸 |\n| **#05** | `EMO-05` | `heureux` | 开心 · 微笑 | 😊 | emotion / emotions | 3s | - | 仿生灵眸数学光线追踪，支持注视移动与自然生命呼吸 |\n| **#06** | `EMO-06` | `hilare` | 大笑 · 欢欣 | 😄 | emotion / emotions | 2.5s | - | 仿生灵眸数学光线追踪，支持注视移动与自然生命呼吸 |\n| **#07** | `EMO-07` | `colere` | 生气 · 严肃 | 潮酷墨镜高光反光扫掠划过双镜片、自信微扬嘴角 |\n| **#119** | `INF-13` | `INF_STUDIO_EMOJI_HEART` | 像素灵动心 · Heart Pulse | 💖 | infinix / studio | 28帧/2.2s | 传音Studio定制 | 大小双心嵌套律动跳动、心尖脉冲微光扩散、迸发微星 |\n| **#120** | `INF-14` | `INF_STUDIO_WEATHER` | 灵动天气台 · Weather Matrix | ⛅ | infinix / studio | 36帧/2.8s | 传音Studio定制 | 旋转金黄太阳、轻盈横穿白云、晶莹雨滴划落 |\n\n";

    const STORAGE_KEY = 'DOT_MATRIX_PROJECT_DOCS_CONTENT_V31';
    const editor = document.getElementById('docEditor');
    const preview = document.getElementById('docPreview');
    const wordCount = document.getElementById('wordCount');
    const modeTip = document.getElementById('modeTip');

    let currentMode = 'preview';
    let lastRenderedMarkdown = '';

    // 初始化内容
    function init() {
      const savedHtml = localStorage.getItem(STORAGE_KEY + '_HTML');
      const saved = localStorage.getItem(STORAGE_KEY);
      editor.value = saved || DEFAULT_TEMPLATE;
      updateWordCount();

      if (savedHtml) {
        preview.innerHTML = savedHtml;
        lastRenderedMarkdown = editor.value;
      } else {
        renderMarkdown();
      }

      // 默认切换至可视化表格展示模式
      setMode('preview');

      // 1. 源码编辑监听
      editor.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY, editor.value);
        localStorage.removeItem(STORAGE_KEY + '_HTML');
        updateWordCount();
        renderMarkdown();
        showAutoSaveStatus();
      });

      // 2. 表格直接编辑监听 (支持用户在可视化表格单元格里直接打字修改)
      preview.addEventListener('input', () => {
        showAutoSaveStatus();
        saveVisualEdits();
      });
    }

    function updateWordCount() {
      wordCount.textContent = `字数: ${editor.value.length}`;
    }

    function showAutoSaveStatus() {
      const el = document.getElementById('saveStatusText');
      el.textContent = '已自动保存';
      setTimeout(() => { el.textContent = '已实时自动保存'; }, 1500);
    }

    // 模式切换
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnPreviewMode').classList.toggle('active', mode === 'preview');
      document.getElementById('btnEditMode').classList.toggle('active', mode === 'edit');

      if (mode === 'preview') {
        const savedHtml = localStorage.getItem(STORAGE_KEY + '_HTML');
        if (!savedHtml || editor.value !== lastRenderedMarkdown) {
          renderMarkdown();
        }
        editor.style.display = 'none';
        preview.style.display = 'block';
        modeTip.innerHTML = '✨ 当前为【表格展示模式】—— 页面所有需求与参数已全部渲染为表格。您可以直接点击任意表格单元格进行修改打字，自动保存至本地！';
      } else {
        editor.style.display = 'block';
        preview.style.display = 'none';
        modeTip.innerHTML = '📝 当前为【Markdown源码模式】—— 您可以直接编辑底层 Markdown 代码或表格语法，切换回表格模式后立即呈现。';
      }
    }

    // 结构化轻量级 Markdown 解析器（将 Markdown 表格与内容完整解析为高保真 HTML 表格）
    function renderMarkdown() {
      const text = editor.value;

      // 1. 提取并保护代码块
      const codeBlocks = [];
      let s = text.replace(/```([\s\S]*?)```/g, (m, code) => {
        codeBlocks.push(code);
        return `\n%%CODE_BLOCK_${codeBlocks.length - 1}%%\n`;
      });

      const lines = s.split('\n');
      const output = [];
      let inList = false;
      let inTable = false;
      let tableRows = [];

      function flushList() {
        if (inList) {
          output.push('</ul>');
          inList = false;
        }
      }

      function flushTable() {
        if (inTable && tableRows.length >= 2) {
          const headerLine = tableRows[0];
          const sepLine = tableRows[1];
          const bodyLines = tableRows.slice(2);

          const headers = headerLine.split('|').slice(1, -1).map(h => h.trim());
          const alignments = sepLine.split('|').slice(1, -1).map(a => {
            const t = a.trim();
            if (t.startsWith(':') && t.endsWith(':')) return 'center';
            if (t.endsWith(':')) return 'right';
            return 'left';
          });

          let html = '<div class="table-container"><table><thead><tr>';
          headers.forEach((h, i) => {
            html += `<th style="text-align:${alignments[i] || 'left'}">${inlineFormat(h)}</th>`;
          });
          html += '</tr></thead><tbody>';
          bodyLines.forEach(row => {
            const cells = row.split('|').slice(1, -1);
            html += '<tr>';
            cells.forEach((c, i) => {
              html += `<td style="text-align:${alignments[i] || 'left'}">${inlineFormat(c.trim())}</td>`;
            });
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          output.push(html);
          inTable = false;
          tableRows = [];
        } else if (inTable) {
          tableRows.forEach(r => output.push(inlineFormat(r) + '<br>'));
          inTable = false;
          tableRows = [];
        }
      }

      function inlineFormat(str) {
        return str
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
          .replace(/\*(.*?)\*/g, '<i>$1</i>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        const line = rawLine.trim();

        // 检查代码块标记
        const codeMatch = line.match(/^%%CODE_BLOCK_(\d+)%%$/);
        if (codeMatch) {
          flushList();
          flushTable();
          const codeContent = codeBlocks[parseInt(codeMatch[1], 10)]
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          output.push(`<pre><code>${codeContent}</code></pre>`);
          continue;
        }

        // 检查表格行 (带有 | 且是表格行)
        if (line.startsWith('|') && line.endsWith('|')) {
          flushList();
          inTable = true;
          tableRows.push(line);
          continue;
        } else {
          flushTable();
        }

        // 检查列表项
        if (line.startsWith('- ')) {
          if (!inList) {
            output.push('<ul>');
            inList = true;
          }
          output.push(`<li>${inlineFormat(line.substring(2))}</li>`);
          continue;
        } else {
          flushList();
        }

        // 检查标题与引用
        if (line.startsWith('# ')) {
          output.push(`<h1>${inlineFormat(line.substring(2))}</h1>`);
        } else if (line.startsWith('## ')) {
          output.push(`<h2>${inlineFormat(line.substring(3))}</h2>`);
        } else if (line.startsWith('### ')) {
          output.push(`<h3>${inlineFormat(line.substring(4))}</h3>`);
        } else if (line.startsWith('#### ')) {
          output.push(`<h4>${inlineFormat(line.substring(5))}</h4>`);
        } else if (line.startsWith('> ')) {
          output.push(`<blockquote>${inlineFormat(line.substring(2))}</blockquote>`);
        } else if (line === '---' || line === '***') {
          output.push('<hr>');
        } else if (line === '') {
          output.push('<br>');
        } else {
          output.push(`<p>${inlineFormat(line)}</p>`);
        }
      }

      flushList();
      flushTable();

      preview.innerHTML = output.join('\n');
      lastRenderedMarkdown = editor.value;
    }

    // 保存可视化表格编辑内容
    function saveVisualEdits() {
      // 可以在本地临时保存 HTML 或保留持久化
      localStorage.setItem(STORAGE_KEY + '_HTML', preview.innerHTML);
    }

    // 手动保存
    function manualSave() {
      localStorage.setItem(STORAGE_KEY, editor.value);
      if (preview.innerHTML) {
        localStorage.setItem(STORAGE_KEY + '_HTML', preview.innerHTML);
      }
      showToast('文档已成功保存到本地存储！');
    }

    // 复制全文
    function copyDocument() {
      navigator.clipboard.writeText(editor.value).then(() => {
        showToast('已成功复制需求文档全文到剪贴板！');
      });
    }

    // 导出 .md 文件
    function exportMarkdown() {
      const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `点阵屏项目_需求规格说明书_${Date.now()}.md`;
      link.click();
      showToast('已成功导出 Markdown 文件！');
    }

    // 恢复默认模板
    function resetToDefaultTemplate() {
      if (confirm('确定要恢复为初始默认的标准需求模板吗？当前修改将会被覆盖。')) {
        editor.value = DEFAULT_TEMPLATE;
        localStorage.setItem(STORAGE_KEY, DEFAULT_TEMPLATE);
        localStorage.removeItem(STORAGE_KEY + '_HTML');
        updateWordCount();
        renderMarkdown();
        showToast('已恢复初始默认标准模板！');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    init();
  </script>
