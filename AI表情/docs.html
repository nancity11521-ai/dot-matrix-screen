## 1. 项目概述与核心目标

本项目专为 **393 颗高密圆形物理点阵屏**（23×23 对称圆阵，间距 0.16mm）研发。突破传统点阵屏单调刻板的图案限制，融合了 **x.ai Grok 灵动球的 3D 视线与连续流体动力学**，并拓展为涵盖 **表情、系统、活动、生活、游戏、氛围** 六大核心品类的全场景点阵交互系统。

### 核心设计目标
1. **极致物理仿真**：精准对应 0707CSP 物理芯片尺寸与间距，真实模拟荧光辉光（Bloom）与铝基底板引线槽。
2. **多维动画体系**：不仅涵盖高灵动度的 AI 仿生表情球，更囊括时钟、仪表、运动、天气、街机游戏等实用与趣味动画。
3. **左右双视窗实时同步**：左侧呈现真实的 393 物理点阵发光与单片机驱动仿真，右侧呈现 600×600 高保真连续矢量/粒子正常显示效果，两边毫秒级逐帧同步，便于开发对比与效果审阅。
4. **即时编辑与交付**：网页自带在线需求文档系统（即改即存），并能直接导出 50 字节 C 语言单片机数组，无缝对接嵌入式研发。

## 3. 全分类详细规划清单 (6 大核心体系)

### 3.1 🤖 【表情分类】（Avatar & Expressions）
*仿生 AI 机器人情感交流与个性化生命体：*

#### 3.1.1 16 种情绪表情
- **平静 (Neutral)**：双眼平视微睁，微弱生命呼吸起伏。
- **专注 (Attentive)**：视线聚焦凝视前上方，眼睑微张，轻微倾斜。
- **惊讶 (Surprised)**：双眼急剧张圆扩大，眼眶提升。
- **兴奋 (Excited)**：双眼外侧上扬，高频灵动微跳。
- **开心 (Happy)**：下眼睑弯成上弦月牙弯弯微笑。
- **大笑 (Hilarious)**：大幅度眯眼月牙笑，伴随上下欢欣起伏。
- **生气 (Angry)**：眉心下压倒八字内倾，眼神锐利严肃。
- **难过 (Sad)**：眼角下垂八字形，眼神暗淡下移。
- **害怕 (Scared)**：瞳孔垂直拉长收窄，小幅颤抖不安。
- **怀疑 (Suspicious)**：单侧挑眉单侧眯眼（大小眼挑衅）。
- **困惑 (Confused)**：双眼轴向不对称反向倾斜，视线漂移。
- **好奇 (Curious)**：大幅度探视侧倾，睁大探寻。
- **得意 (Proud)**：双眼半眯，嘴角弧度上翘神气自信。
- **羞怯 (Shy)**：视线羞涩向下偏移，瞳孔聚拢内收。
- **无趣 (Unimpressed)**：大半眼帘遮蔽，无精打采水平瞥视。
- **困倦 (Sleepy)**：沉重眼皮规律性垂落打瞌睡。

#### 3.1.2 14 种动作状态
- **待机呼吸 (Idle)**：怠速柔和缩放呼吸律动。
- **思考沉思 (Thinking)**：视线右上飘移，伴随思考悬浮气泡。
- **俏皮眨眼 (Wink)**：单眼规律性快速开合眨动。
- **睁大双眼 (Wide)**：突然放大警觉探视四周。
- **警觉发现 (Alert)**：双眼高频水平快速扫视，外圈红色警报闪烁。
- **消息提示 (Notify)**：双眼正视，右上角弹出醒目通知气泡与铃铛提示。
- **感叹唤醒 (Exclaim)**：惊叹变身，感叹号跳跃唤醒。
- **深度睡眠 (Sleep)**：双眼闭合为平直细线，伴随 Zzz 浮动升空。
- **椭圆律动 (Egg)**：平滑有机形体椭圆舒展变换。
- **六边晶格 (Hexagon)**：六边形蜂窝几何矩阵伸缩律动。
- **弹跳趣味 (Play)**：球体像弹性网球般规律落地反弹。
- **行星环绕 (Orbit)**：带有立体光带环绕球体公转。
- **粒子爆发 (Burst)**：由内向外绽放重组的粒子爆炸。
- **彗星飞掠 (Comet)**：高亮彗星拖着渐隐长尾划过天际。

#### 3.1.3 灵动眼眸与符号
- **触电电眼 (EYE_SHOCK)**：闪电折线折射电眼。
- **弯月笑眼 (EYE_GRIN)**：圆弧笑眯弯月。
- **情绪双眸 (EYES)**：左右注视转动的拟人双眼。
- **心情变换 (MOOD)**：戏剧面具双向变脸。
- **心意爱心 (HEART)**：经典饱满爱心轮廓。
- **心跳回响 (HEARTBEAT)**：模拟真实心脏双重收缩律动脉动。

### 3.2 ⚙️ 【系统分类】（System & Hardware）
*硬件状态监测、传感器感知与实用指示：*

#### 3.2.1 时间与日历
- **数字时间 (CLOCK)**：上下双层垂直数字时钟，中心呼吸冒号，外圆周 60 秒刻度走时。
- **双层日期 (DATE)**：月份与日期上下双层卡片排版。
- **星期显示 (WEEKDAY)**：7 段环形星期轮盘指示当前星期。

#### 3.2.2 硬件仪表
- **电量百分比 (BATTERY)**：弧形电量计根据数值平滑变色（绿/黄/红），中心展示精准百分比与充电闪电。
- **充电流光 (CHARGE)**：双层旋转电弧流光环与中心高能闪电脉冲。
- **音量阶梯 (VOLUME)**：弧形音量阶梯柱，随左侧电平输入实时动态升降。
- **环境温度 (TEMP)**：温度计圆弧表盘，展示当前 °C 读数与冷暖渐变。

#### 3.2.3 传感连接
- **星罗盘指南针 (COMPASS)**：360° 航海罗盘针，随方位角滑块实时精准旋转，红白指针指示南北。
- **雷达扫描 (RADAR)**：360° 连续平滑旋转扫描锥光束与磷光余辉绿点回波探测。
- **蓝牙连接 (BLUETOOTH)**：中心发光蓝牙符文与连续向外扩散的无线电波涟漪。
- **能量环流 (ENERGY_RING)**：双重同心发光能量环、核心能量球、沿外环高速公转并带有渐隐光尾的能量光球，以及向外扩散的冲击波。

---

### 3.3 🏃 【活动分类】（Activity & Fitness）
*健康运动、效率专注与工作日常：*

#### 3.3.1 运动健康
- **动感奔跑者 (RUNNER)**：流畅摆臂、蹬腿迈步的连续跑步小人，伴随地面风行速度线。
- **万步达成 (STEPS)**：三色健康运动圆环（Move/Exercise/Stand）与计步数字。
- **健身律动 (WORKOUT)**：动态心率心电波形与脉搏跳动。
- **跃动小人 (PERSON)**：开合跳跃小人。

#### 3.3.2 专注效率
- **时砂专注 (FOCUS)**：流沙沙漏与专注计时。
- **沙漏倒计时 (SAND)**：透明玻璃沙漏，上方细沙逐渐漏空、下层沙堆垒起，连续流沙下落。
- **三排进度条 (PROGRESS)**：三条独立进度条波浪式加载。
- **完成确认 (SUCCESS)**：绿色圆形印章中绘制出打勾徽章与庆祝粒子。
- **邮件到达 (MAIL)**：信封开启弹出未读邮件卡片。

---

### 3.4 ☕ 【生活分类】（Daily Life & Nature）
*天气变换、影音作息与宠物生灵：*

#### 3.4.1 气象万千
- **阳光晴天 (SUNNY)**：动态太阳自转光芒与光晕呼吸。
- **浮云飘拂 (CLOUDY)**：多层蓬松白云在微风中左右飘拂。
- **雨滴涟漪 (RAINY)**：云层下斜向雨丝降落，落地溅起同心圆水花涟漪。
- **像素落雨 (RAIN)**：极简雨丝线阵。
- **冬日落雪 (SNOW)**：六角晶莹雪花随风摇曳缓缓飘落。
- **闪电雷暴 (STORM)**：乌云中一道撕裂夜空的金黄劈叉闪电电光。

#### 3.4.2 影音与日常
- **跳动声波 (WAVE)**：Siri 风格三色流动声波缎带，伴随音频节奏起伏。
- **音频频谱 (SPECTRUM)**：14 段平滑弹跳音频均衡器柱状图。

### 4.2 左右双视窗实时同步系统规范（核心技术特性）

为确保物理点阵研发效果与设计师预期的正常界面高度匹配，系统必须严格执行左右双视窗实时帧同步：

1. **时基与时钟严格统一**：
   - 左侧点阵屏与右侧正常显示屏共享同一个时钟源 \`state.time\` 与播放状态（播放/暂停/逐帧微调/倍速/时间轴拖动）。
   - 动画播放过程中，左右两侧帧频绝对锁定（30FPS~60FPS 同步更新）。
2. **硬件交互参数全链路联动**：
   - 当在左侧控制面板拖动 **电量滑块 (Battery)** 时，左侧 393 点阵与右侧正常电池仪表弧同时更新读数与颜色。
   - 当拖动 **温度滑块 (Temp)** 时，左侧与右侧温控表盘同时刷新读数与冷暖渐变。
   - 当拖动 **音量滑块 (Volume)** 时，左侧与右侧弧形电平阶梯同时升降。
   - 当拖动 **罗盘滑块 (Compass)** 时，左侧点阵指针与右侧高保真红银磁针同时旋转对齐方位。
3. **右侧全分类高保真正常显示渲染标准**：
   - **拒绝占位符与静态 Emoji**：所有 6 大分类 100+ 款动画在右视窗均具备专属的平滑矢量/粒子级视觉呈现。
   - **针对「能量环流」等复杂动效**：右侧展示高保真双重同心光环、中心能量核心、沿外环高速旋转并带有渐隐光尾的能量光球，以及向外扩散的同心冲击波，与左侧 393 点阵屏的旋转公转节奏保持 100% 相同。

## 5. 移动端与系统级交互需求 (桌面小部件 & 控制中心)

为深度融入手机/平板/穿戴设备操作系统生态，赋予点阵屏全天候便捷开关与场景化硬件调用能力，新增以下系统级入口与快捷控制规范：

### 5.1 📱 桌面 2×2 圆形小部件规格 (Desktop 2×2 Widget)

1. **尺寸与形态定义**：
   - **占用网格**：标准桌面 2×2 网格空间（适配 iOS WidgetKit / Android AppWidget / 智能外屏小组件）。
   - **外形特征**：圆形深邃卡片形态（直径自适应桌面标准图标组），采用高斯模糊暗黑半透明毛玻璃底盘与微倒角金属外环。
   - **视觉状态展示**：
     - **开机态 (Power ON)**：外圆环带有一缕柔和的主题色（如暖麦金/极光青）微光呼吸光晕，中心微缩显示当前点阵屏播放动画或运行状态简报。
     - **休眠态 (Power OFF)**：外圆环转为极简哑光深灰，中心显示微弱待机电源图标，表示处于超低功耗休眠。
2. **手势交互逻辑规范**：
   - **单击 (Single Tap)**：
     - 控制点阵屏总电源开/关（Toggle Power State）。
     - 触发物理点阵屏所有灯珠平滑淡出关断，或呼吸唤醒亮屏。小部件状态随之实时刷新。
   - **长按 (Long Press, 按压持续时间 ≥ 500ms)**：
     - 系统触发轻触线性马达震动反馈（Haptic Tap）。
     - **不触发开关切换**，直接调起并跳转进入**「点阵屏系统设置页」**（可在此配置动画分类偏好、全局亮度、调色板、手电筒功率及硬件模拟参数）。

---

### 5.2 🎛️ 控制中心 3 个快捷按钮规范 (Control Center Quick Tiles)

在操作系统下拉控制中心（Control Center / Quick Settings）提供 3 颗独立快捷开关磁贴：

#### 1. 按钮 A：【点阵屏开关】(Matrix Power Tile)
- **图标形态**：点阵屏专属圆形微密点阵发光标识。
- **核心功能**：一键切换点阵屏硬件供电状态（开机运行 ↔ 熄屏休眠）。
- **状态指示**：开启时按钮背景呈现主题高亮激活色，附文字“点阵屏：开启”；关闭时呈半透明深灰无源态。

#### 2. 按钮 B：【点阵屏手电筒】(Matrix Flashlight / Floodlight Mode)
- **图标形态**：聚光手电筒叠加点阵微孔图标。
- **核心功能**：
  - 点击打开后，点阵屏 **全部 393 颗灯珠全量点亮（100% 满功率恒流高亮白光）**，作为全矩阵无死角漫反射护眼手电筒使用。
- **关键联动与互斥规则 (严格执行)**：
  - **规则 1**：当打开「点阵屏手电筒」时，控制中心内的**手电筒图标必须同步高亮亮起（呈激活态）**，作为系统手电筒状态的视觉提示。
  - **规则 2**：**但是手机/设备自身的后置物理 LED 闪光灯手电筒本身不点亮**（照明完全交由点阵屏负责，避免多重光源相互干扰晃眼）。
  - **规则 3**：再次点击关闭「点阵屏手电筒」时，点阵屏 393 颗灯恢复关闭前的原动画播放状态，控制中心手电筒图标同步熄灭。

#### 3. 按钮 C：【系统机身手电筒】(Device Hardware Flashlight)
- **图标形态**：系统原生标准后置手电筒图标。
- **核心功能**：
  - 控制手机/设备机身背部原生物理 LED 补光灯/闪光灯手电筒。
- **与点阵屏的绝对物理隔离规则 (严格执行)**：
  - 单独点击该系统手电筒图标时，**只有手机机身物理后置手电筒点亮发光**。
  - **与点阵屏完全没有关系**：点阵屏不亮、不熄灭、不切换任何模式，保持原有正常动画或休眠状态，不受任何影响。

      editor.addEventListener('input', () => {

    }

    function updateWordCount() {

    }

    function showAutoSaveStatus() {
      const el = document.getElementById('saveStatusText');
      el.textContent = '已自动保存';
      setTimeout(() => { el.textContent = '已实时自动保存'; }, 1500);
    }

    // 模式切换
    function setMode(mode) {
      document.getElementById('btnEditMode').classList.toggle('active', mode === 'edit');
      document.getElementById('btnPreviewMode').classList.toggle('active', mode === 'preview');

      if (mode === 'edit') {
        editor.style.display = 'block';
        preview.style.display = 'none';
      } else {
        renderMarkdown();
        editor.style.display = 'none';
        preview.style.display = 'block';
      }
    }

    // 轻量级原生 Markdown 解析器
    function renderMarkdown() {
      const text = editor.value;
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
        .replace(/\*(.*?)\*/gim, '<i>$1</i>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        .replace(new RegExp('<li>[\\s\\S]*?<\\/li>', 'gim'), (m) => '<ul>' + m + '</ul>')
        .replace(/\n/g, '<br>');

      preview.innerHTML = html;
    }

    // 手动保存
    function manualSave() {
      localStorage.setItem(STORAGE_KEY, editor.value);
      showToast('文档已成功保存到本地存储！');
    }

    // 复制全文
    function copyDocument() {
      navigator.clipboard.writeText(editor.value).then(() => {
        showToast('已成功复制需求文档全文到剪贴板！');
      });
    }

    // 导出 .md 文件
    function exportMarkdown() {
      const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `点阵屏项目_需求规格说明书_${Date.now()}.md`;
      link.click();
      showToast('已成功导出 Markdown 文件！');
    }

    // 恢复默认模板
    function resetToDefaultTemplate() {
      if (confirm('确定要恢复为初始默认的需求模板吗？当前修改将会被覆盖。')) {
        editor.value = DEFAULT_TEMPLATE;
        localStorage.setItem(STORAGE_KEY, DEFAULT_TEMPLATE);
        updateWordCount();
        renderMarkdown();
        showToast('已恢复初始默认模板！');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    init();
  </script>
</body>
</html>
