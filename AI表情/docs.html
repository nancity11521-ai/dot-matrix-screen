<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点阵屏项目 · 需求规格说明文档</title>
  <style>
    :root {
      --bg: #070b0f;
      --panel: #0d141a;
      --panel-border: #1e2a35;
      --card-bg: #121c24;
      --accent: #ffd45e;
      --accent-glow: rgba(255, 212, 94, 0.4);
      --text: #e6edf3;
      --muted: #8b9baa;
      --dim: #485764;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% -10%, #15222c 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 20, 26, 0.92);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #141f28;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 11px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #1e2c38; border-color: var(--accent); }

    .brand-title h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(255, 212, 94, 0.12);
      border: 1px solid rgba(255, 212, 94, 0.3);
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: #15202a;
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { background: #1e2c38; border-color: #3b5062; }
    .btn.active {
      background: rgba(255, 212, 94, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1116;
      font-weight: 700;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* 主内容区 */
    main {
      flex: 1;
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .editor-container {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 150px);
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #0d141a;
      border-bottom: 1px solid var(--panel-border);
      font-size: 12px;
      color: var(--muted);
    }

    /* 文本编辑框 */
    #docEditor {
      width: 100%;
      flex: 1;
      min-height: 700px;
      background: transparent;
      border: none;
      outline: none;
      padding: 24px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "PingFang SC", sans-serif;
      font-size: 13.5px;
      line-height: 1.7;
      resize: vertical;
      white-space: pre-wrap;
    }

    /* 预览容器 */
    #docPreview {
      display: none;
      padding: 32px 38px;
      color: var(--text);
      line-height: 1.8;
      font-size: 14px;
    }

    /* 预览 Markdown 样式 */
    #docPreview h1 {
      font-size: 24px;
      color: var(--accent);
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }
    #docPreview h2 {
      font-size: 18px;
      color: #7dd3fc;
      margin-top: 32px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 8px;
    }
    #docPreview h3 {
      font-size: 15px;
      color: #e2e8f0;
      margin-top: 24px;
      margin-bottom: 10px;
    }
    #docPreview h4 {
      font-size: 13.5px;
      color: #ffd45e;
      margin-top: 18px;
      margin-bottom: 8px;
    }
    #docPreview p { margin-bottom: 14px; color: #cbd5e1; }
    #docPreview ul, #docPreview ol { margin-left: 24px; margin-bottom: 16px; color: #cbd5e1; }
    #docPreview li { margin-bottom: 6px; }
    #docPreview code {
      background: #1a2530;
      padding: 2px 6px;
      border-radius: 4px;
      color: #f6ad55;
      font-family: monospace;
      font-size: 12px;
    }
    #docPreview pre {
      background: #090e13;
      border: 1px solid var(--panel-border);
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    #docPreview pre code { background: none; padding: 0; color: #93c5fd; }
    #docPreview blockquote {
      border-left: 3px solid var(--accent);
      padding: 10px 18px;
      background: rgba(255, 212, 94, 0.06);
      border-radius: 0 8px 8px 0;
      margin-bottom: 18px;
      color: #e2e8f0;
    }
    #docPreview hr {
      border: none;
      border-top: 1px solid var(--panel-border);
      margin: 28px 0;
    }

    /* 表格增强样式 */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 24px;
      border-radius: 8px;
      border: 1px solid #1e2d3d;
      background: #0e1720;
    }
    #docPreview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      line-height: 1.6;
    }
    #docPreview th, #docPreview td {
      border: 1px solid #1b2733;
      padding: 10px 14px;
    }
    #docPreview th {
      background: #131e28;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      border-bottom: 2px solid rgba(255, 212, 94, 0.35);
    }
    #docPreview tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    #docPreview tr:hover { background: rgba(255, 212, 94, 0.05); }

    /* 浮动提示 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #192733;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

  <!-- 顶部导航 -->
  <header>
    <div class="brand">

  <!-- 主编辑区 -->
  <main>

  </main>

  <script>
    const DEFAULT_TEMPLATE = "# \u70b9\u9635\u5c4f\u9879\u76ee \u00b7 \u9700\u6c42\u89c4\u683c\u8bf4\u660e\u4e66 (\u901a\u4fd7\u6613\u61c2\u5168\u529f\u80fd\u7248)\n\n> **\u6587\u6863\u7248\u672c**\uff1av2.3.0 (\u901a\u4fd7\u6613\u61c2\u00b7\u5168\u8868\u683c\u5316\u5c55\u793a\u7248)  \n> **\u9879\u76ee\u540d\u79f0**\uff1a\u70b9\u9635\u5c4f\u9879\u76ee\uff08AI \u8868\u60c5\u4e0e\u5168\u573a\u666f\u52a8\u753b\u7cfb\u7edf\uff09  \n> **\u8d1f\u8d23\u4eba**\uff1a\u5357\u57ce  \n> **\u5c4f\u5e55\u8bbe\u5907**\uff1a\u76f4\u5f84 20 \u6beb\u7c73\u7684\u8d85\u5c0f\u5706\u5f62\u53d1\u5149\u5c4f\uff08\u5185\u7f6e 393 \u9897\u5fae\u578b\u53d1\u5149\u5c0f\u706f\u73e0\uff09  \n> **\u6700\u540e\u4fee\u8ba2\u65e5\u671f**\uff1a2026-11-05  \n\n---\n\n## 1. \u8fd9\u662f\u4e00\u4e2a\u4ec0\u4e48\u4ea7\u54c1\uff1f\uff08\u901a\u4fd7\u4ecb\u7ecd\u4e0e\u6838\u5fc3\u770b\u70b9\uff09\n\n\u672c\u9879\u76ee\u662f\u4e3a\u4e00\u6b3e**\u50cf\u786c\u5e01\u4e00\u6837\u5c0f\u5de7\u7684\u5706\u5f62\u53d1\u5149\u5c4f\u5e55**\u91cf\u8eab\u6253\u9020\u7684\u4e92\u52a8\u7cfb\u7edf\u3002\u6574\u4e2a\u5c4f\u5e55\u53ea\u6709\u5927\u7ea6 2 \u5398\u7c73\u5bbd\uff0c\u5374\u5bc6\u5bc6\u9ebb\u9ebb\u6392\u5217\u7740 **393 \u9897\u7c73\u7c92\u5927\u5c0f\u7684\u5fae\u578b\u53d1\u5149\u5c0f\u706f\u73e0**\u3002\n\n\u6211\u4eec\u6253\u7834\u4e86\u4f20\u7edf\u70b9\u9635\u5c4f\u53ea\u80fd\u663e\u793a\u5446\u677f\u6570\u5b57\u7684\u9650\u5236\uff0c\u628a\u751f\u52a8\u6d3b\u6cfc\u7684 **AI \u4eff\u751f\u7075\u52a8\u8868\u60c5\u5305**\u3001**\u5b9e\u7528\u65f6\u949f\u4e0e\u7535\u91cf\u8868\u76d8**\u3001**\u8fd0\u52a8\u5065\u8eab\u6253\u5361**\u3001**\u5929\u6c14\u53d8\u5316**\u3001**\u590d\u53e4\u8857\u673a\u5c0f\u6e38\u620f** \u4ee5\u53ca **\u8282\u65e5\u6e29\u99a8\u6c1b\u56f4\u706f** \u5171 **6 \u5927\u5206\u7c7b\u3001100 \u591a\u6b3e\u52a8\u753b** \u878d\u4e3a\u4e00\u4f53\u3002\n\n### \u5de6\u53f3\u53cc\u5c4f\u540c\u6b65\u5bf9\u6bd4\uff08\u5927\u767d\u8bdd\u8bf4\u660e\uff09\n\n\u7f51\u9875\u4e0a\u8bbe\u8ba1\u4e86\u4e24\u4e2a\u5706\u76d8\uff0c\u5de6\u8fb9\u662f\u5c0f\u706f\u73e0\u53d1\u5149\u7684\u5b9e\u9645\u6548\u679c\uff0c\u53f3\u8fb9\u662f\u666e\u901a\u624b\u673a/\u7535\u8111\u4e0a\u7684\u9ad8\u6e05\u987a\u6ed1\u6548\u679c\u3002\u4e24\u8005\u662f**\u5206\u79d2\u4e0d\u5dee\u3001\u5b9e\u65f6\u540c\u6b65**\u7684\uff1a\n\n| \u5bf9\u6bd4\u7ef4\u5ea6 | \u5de6\u89c6\u7a97\uff1a\u70b9\u9635\u53d1\u5149\u5c4f | \u53f3\u89c6\u7a97\uff1a\u666e\u901a\u9ad8\u6e05\u5c4f | \u4e3a\u4ec0\u4e48\u8fd9\u4e48\u505a\uff1f |\n| :--- | :--- | :--- | :--- |\n| **\u753b\u9762\u957f\u4ec0\u4e48\u6837** | \u7531 393 \u9897\u5fae\u578b\u6696\u9ec4\u5c0f\u706f\u73e0\u7ec4\u6210\uff0c\u5e26\u6709\u590d\u53e4\u79d1\u6280\u611f\u4e0e\u67d4\u548c\u5fae\u5149\u5149\u6655 | \u987a\u6ed1\u65e0\u566a\u70b9\u7684\u9ad8\u6e05\u77e2\u91cf\u5f69\u8272\u753b\u9762\uff0c\u7ec6\u817b\u5c55\u793a\u6240\u6709\u52a8\u6001\u7ec6\u8282 | \u4e00\u773c\u770b\u51fa\u5b9e\u9645\u505a\u6210\u5c0f\u5706\u5c4f\u662f\u4ec0\u4e48\u6548\u679c |\n| **\u8c01\u6700\u9002\u5408\u770b** | \u786c\u4ef6\u5de5\u7a0b\u5e08\u3001\u60f3\u8981\u770b\u771f\u5b9e\u8bbe\u5907\u53d1\u5149\u8d28\u611f\u7684\u7528\u6237 | \u52a8\u753b\u8bbe\u8ba1\u5e08\u3001\u559c\u6b22\u770b\u7ec6\u817b\u987a\u6ed1\u52a8\u753b\u7684\u666e\u901a\u7528\u6237 | \u6ee1\u8db3\u4e0d\u540c\u4eba\u7fa4\u7684\u5ba1\u9605\u9700\u6c42\uff0c\u5f00\u53d1\u4e0e\u8bbe\u8ba1\u4e24\u4e0d\u8bef |\n| **\u52a8\u4f5c\u540c\u6b65\u60c5\u51b5** | \u53ea\u8981\u53f3\u8fb9\u5728\u52a8\uff0c\u5de6\u8fb9\u7684\u5c0f\u706f\u73e0\u5c31\u4ee5**\u5b8c\u5168\u76f8\u540c\u7684\u8282\u594f\u548c\u5e27\u7387**\u8ddf\u7740\u52a8 | \u53ea\u8981\u5de6\u8fb9\u8c03\u8fdb\u5ea6\uff0c\u53f3\u8fb9\u7684\u753b\u9762\u4e5f**\u5b8c\u5168\u540c\u6b65**\u8df3\u8f6c\u5230\u5bf9\u5e94\u4f4d\u7f6e | \u7edd\u4e0d\u51fa\u73b0\u4e24\u8fb9\u52a8\u4f5c\u5404\u8d70\u5404\u3001\u8282\u594f\u5bf9\u4e0d\u4e0a\u7684\u60c5\u51b5 |\n| **\u6ed1\u5757\u8c03\u8282\u8054\u52a8** | \u62d6\u52a8\u5de6\u8fb9\u7684\u7535\u91cf\u3001\u97f3\u91cf\u3001\u6e29\u5ea6\u6ed1\u5757\uff0c\u5de6\u8fb9\u70b9\u9635\u7acb\u5373\u6539\u53d8 | \u62d6\u52a8\u5de6\u8fb9\u7684\u7535\u91cf\u3001\u97f3\u91cf\u3001\u6e29\u5ea6\u6ed1\u5757\uff0c\u53f3\u8fb9\u9ad8\u6e05\u4eea\u8868\u540c\u6b65\u5237\u65b0 | \u5168\u94fe\u8def\u8054\u52a8\uff0c\u6d4b\u8bd5\u786c\u4ef6\u65f6\u4e0d\u7528\u53cd\u590d\u5237\u65b0\u9875\u9762 |\n\n---\n\n## 2. \u786c\u4ef6\u957f\u4ec0\u4e48\u6837\uff1f\uff08\u5916\u89c2\u4e0e\u89c4\u683c\u53c2\u6570\u5927\u767d\u8bdd\u8868\uff09\n\n### 2.1 \u5c4f\u5e55\u786c\u4ef6\u89c4\u683c\u8bf4\u660e\u8868\n\n| \u786c\u4ef6\u6307\u6807 | \u8bf4\u660e\u4e0e\u901a\u4fd7\u89e3\u91ca | \u5b9e\u9645\u53c2\u6570 / \u89c4\u683c |\n| :--- | :--- | :--- |\n| **\u5c4f\u5e55\u6574\u4f53\u5927\u5c0f** | \u6574\u4e2a\u53d1\u5149\u5706\u76d8\u7684\u76f4\u5f84\uff0c\u548c\u65e5\u5e38\u7528\u7684\u4e00\u5143\u786c\u5e01\u5927\u5c0f\u57fa\u672c\u4e00\u81f4 | \u76f4\u5f84 20 \u6beb\u7c73 (2.0 cm) |\n| **\u53d1\u5149\u5c0f\u706f\u603b\u6570** | \u5c4f\u5e55\u4e0a\u4e00\u5171\u7531\u591a\u5c11\u9897\u72ec\u7acb\u53ef\u63a7\u7684\u53d1\u5149\u706f\u73e0\u7ec4\u6210 | **393 \u9897\u5fae\u578b\u53d1\u5149\u706f\u73e0** |\n| **\u6392\u5e03\u5f62\u72b6** | 23 \u884c\u5bf9\u79f0\u5706\u76d8\u6392\u5217\uff0c\u4e2d\u95f4\u6700\u5bbd\uff0c\u4e0a\u4e0b\u4e24\u7aef\u5e73\u7f13\u6536\u7a84\u4e3a\u5706\u5f27 | \u6700\u591a\u4e00\u884c 23 \u9897\u706f\uff0c\u6700\u5c11\u4e00\u884c 5 \u9897\u706f |\n| **\u5c0f\u706f\u4e4b\u95f4\u7684\u8ddd\u79bb** | \u76f8\u90bb\u4e24\u9897\u5c0f\u706f\u73e0\u4e2d\u5fc3\u4e4b\u95f4\u7684\u5fae\u5c0f\u7f1d\u9699\uff0c\u6392\u5217\u6781\u5176\u81f4\u5bc6 | 0.16 \u6beb\u7c73\uff08\u8089\u773c\u770b\u53bb\u7ec6\u817b\u67d4\u548c\uff09 |\n| **\u9ed8\u8ba4\u53d1\u5149\u989c\u8272** | \u7ecf\u5178\u6e29\u6696\u7684\u590d\u53e4\u9ea6\u91d1\u9ec4\u5149\uff0c\u6e29\u6da6\u4e0d\u523a\u773c | \u6696\u91d1\u9ec4\u5149\uff08\u5728\u7f51\u9875\u4e0a\u53ef\u968f\u5fc3\u6362\u6210\u5176\u4ed6\u989c\u8272\uff09 |\n| **\u53d1\u  6. \u7f51\u9875\u600e\u4e48\u64cd\u4f5c\uff1f\uff08\u7f51\u9875\u754c\u9762\u529f\u80fd\u5927\u767d\u8bdd\u8868\uff09\n\n\u7f51\u9875\u7248\u662f\u4e00\u4e2a\u529f\u80fd\u5b8c\u6574\u7684\u5728\u7ebf\u8c03\u8bd5\u4e0e\u4f53\u9a8c\u5de5\u4f5c\u53f0\uff0c\u4e3b\u8981\u5206\u4e3a\u56db\u4e2a\u4e3b\u8981\u533a\u57df\uff1a\n\n| \u9875\u9762\u533a\u57df | \u6240\u5728\u4f4d\u7f6e | \u91cc\u9762\u6709\u4ec0\u4e48\u6309\u94ae\u548c\u529f\u80fd | \u666e\u901a\u7528\u6237\u600e\u4e48\u7528\uff1f |\n| :--- | :--- | :--- | :--- |\n| **\u9876\u90e8\u72b6\u6001\u6761** | \u6574\u4e2a\u7f51\u9875\u6700\u4e0a\u65b9 | \u5f53\u524d\u4eae\u4e86\u591a\u5c11\u9897\u5c0f\u706f\u7684\u8ba1\u6570\uff08\u4f8b\u5982 186/393 \u4eae\u8d77\uff09\u3001**\u300c\ud83d\udcdd \u9700\u6c42\u8bf4\u660e\u6587\u6863\u300d** \u72ec\u7acb\u5165\u53e3 | \u968f\u65f6\u770b\u4e00\u773c\u706f\u73e0\u4eae\u8d77\u6bd4\u4f8b\uff1b\u70b9\u51fb\u9700\u6c42\u6587\u6863\u5728\u65b0\u6807\u7b7e\u9875\u968f\u65f6\u67e5\u770b\u4e0e\u4fee\u6539\u672c\u6587\u6863 |\n| **\u5de6\u4fa7\u63a7\u5236\u9762\u677f** | \u7f51\u9875\u5de6\u8fb9\u4e00\u680f | \u5c4f\u5e55\u4eae\u5ea6\u6ed1\u52a8\u6761\u3001\u53d1\u5149\u5149\u6655\u5927\u5c0f\u6ed1\u52a8\u6761\u30016\u6b3e\u7ecf\u5178\u914d\u8272\u4e0e\u5f69\u8679\u53d6\u8272\u5668\u3001\u6a21\u62df\u624b\u673a\u7535\u91cf/\u97f3\u91cf/\u6e29\u5ea6\u7684\u6ed1\u5757 | \u8c03\u8c03\u81ea\u5df1\u559c\u6b22\u7684\u989c\u8272\u548c\u4eae\u5ea6\uff1b\u62c9\u52a8\u7535\u91cf\u6ed1\u5757\uff0c\u770b\u770b\u7535\u91cf\u4f4e\u7684\u65f6\u5019\u7535\u6c60\u8868\u76d8\u600e\u4e48\u53d8\u7ea2 |\n| **\u4e2d\u592e\u6838\u5fc3\u5c55\u53f0** | \u7f51\u9875\u6b63\u4e2d\u95f4 | **\u5de6\u8fb9\u70b9\u9635\u5c4f\u3001\u53f3\u8fb9\u9ad8\u6e05\u5c4f**\u3001\u5e95\u90e8\u64ad\u653e/\u6682\u505c/\u5355\u5e27\u524d\u540e\u9000\u63a7\u5236\u6761\u30010.25\u500d~2\u500d\u64ad\u653e\u901f\u5ea6\u9009\u62e9 | \u50cf\u770b\u89c6\u9891\u64ad\u653e\u5668\u4e00\u6837\uff0c\u968f\u65f6\u6682\u505c\u7ec6\u770b\u6bc ce | \u589e\u52a0\u624b\u673a\u684c\u9762 2\u00d72 \u5706\u5f62\u5c0f\u90e8\u4ef6\uff08\u5355\u51fb\u5f00\u5173\u3001\u957f\u6309\u8fdb\u8bbe\u7f6e\uff09\u53ca\u63a7\u5236\u4e2d\u5fc3 3 \u5feb\u6377\u6309\u94ae\u8054\u52a8\u89c4\u8303\uff08\u70b9\u9635\u5f00\u5173\u3001\u70b9\u9635\u624b\u7535\u7b52\u3001\u624b\u673a\u624b\u7535\u7b52\u4e92\u65a5\u903b\u8f91\uff09\u3002 |\n| **v2.1.0** | 2026-11-05 | \u5357\u57ce | \u5b9e\u73b0\u5de6\u53f3\u53cc\u89c6\u7a97\u6beb\u79d2\u7ea7\u5b9e\u65f6\u5e27\u540c\u6b65\uff08\u5de6\u70b9\u9635\u53d1\u5149\u5c4f + \u53f3\u9ad8\u6e05\u6b63\u5e38\u663e\u793a\uff09\uff0c\u6253\u901a\u7535\u91cf/\u97f3\u91cf/\u6e29\u5ea6\u5168\u94fe\u8def\u6ed1\u5757\u8054\u52a8\u3002 |\n| **v2.0.0** | 2026-11-05 | \u5357\u57ce | \u786e\u7acb 6 \u5927\u6838\u5fc3\u52a8\u753b\u5206\u7c7b\uff08\u8868\u60c5/\u7cfb\u7edf/\u6d3b\u52a8/\u751f\u6d3b/\u6e38\u620f/\u6c1b\u56f4\uff09\uff0c\u65b0\u589e\u72ec\u7acb\u53ef\u7f16\u8f91\u5728\u7ebf\u9700\u6c42\u6587\u6863\u7cfb\u7edf\u3002 |\n| **v1.0.0** | 2026-11-04 | \u5357\u57ce | \u5b8c\u6210 393 \u9897\u5706\u9635\u7269\u7406\u70b9\u9635\u5c4f\u786c\u4ef6\u6392\u5e03\u8bbe\u8ba1\u4e0e\u5355\u7247\u673a 50 \u5b57\u8282 C \u6570\u7ec4\u9a71\u52a8\u539f\u578b\u3002 |\n\n---\n\n## 10. \u540e\u7eed\u65b0\u589e\u60f3\u6cd5\u8bb0\u5f55\u533a (\u5907\u5fd8\u5f55)\n\n> *\uff08\u5357\u57ce\uff1a\u60a8\u53ef\u4ee5\u5728\u4e0b\u65b9\u76f4\u63a5\u6253\u5b57\u8bb0\u4e0b\u65b0\u7684\u7075\u611f\u6216\u9700\u8981\u8fdb\u4e00\u6b65\u8c03\u6574\u7684\u7ec6\u8282\uff09*\n\n- [ ] \u65b0\u60f3\u6cd5 1\uff1a\n- [ ] \u65b0\u60f3\u6cd5 2\uff1a\n- [ ] \u65b0\u60f3\u6cd5 3\uff1a\n";

    const STORAGE_KEY = 'DOT_MATRIX_PROJECT_DOCS_CONTENT_V7';
    const editor = document.getElementById('docEditor');
    const preview = document.getElementById('docPreview');
    const wordCount = document.getElementById('wordCount');

    // 初始化内容
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      editor.value = saved || DEFAULT_TEMPLATE;
      updateWordCount();
      renderMarkdown();

      // 实时自动保存监听
      editor.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY, editor.value);
        updateWordCount();
        renderMarkdown();
        showAutoSaveStatus();
      });
    }

    function updateWordCount() {
      wordCount.textContent = `字数: ${editor.value.length}`;
    }

    function showAutoSaveStatus() {
      const el = document.getElementById('saveStatusText');
      el.textContent = '已自动保存';
      setTimeout(() => { el.textContent = '已实时自动保存'; }, 1500);
    }

    // 模式切换
    function setMode(mode) {
      document.getElementById('btnEditMode').classList.toggle('active', mode === 'edit');
      document.getElementById('btnPreviewMode').classList.toggle('active', mode === 'preview');

      if (mode === 'edit') {
        editor.style.display = 'block';
        preview.style.display = 'none';
      } else {
        renderMarkdown();
        editor.style.display = 'none';
        preview.style.display = 'block';
      }
    }

    // 结构化轻量级 Markdown 解析器（全面支持表格、列表、标题、引用与代码）
    function renderMarkdown() {
      const text = editor.value;

      // 1. 提取并保护代码块
      const codeBlocks = [];
      let s = text.replace(/```([\s\S]*?)```/g, (m, code) => {
        codeBlocks.push(code);
        return `\n%%CODE_BLOCK_${codeBlocks.length - 1}%%\n`;
      });

      const lines = s.split('\n');
      const output = [];
      let inList = false;
      let inTable = false;
      let tableRows = [];

      function flushList() {
        if (inList) {
          output.push('</ul>');
          inList = false;
        }
      }

      function flushTable() {
        if (inTable && tableRows.length >= 2) {
          const headerLine = tableRows[0];
          const sepLine = tableRows[1];
          const bodyLines = tableRows.slice(2);

          const headers = headerLine.split('|').slice(1, -1).map(h => h.trim());
          const alignments = sepLine.split('|').slice(1, -1).map(a => {
            const t = a.trim();
            if (t.startsWith(':') && t.endsWith(':')) return 'center';
            if (t.endsWith(':')) return 'right';
            return 'left';
          });

          let html = '<div class="table-container"><table><thead><tr>';
          headers.forEach((h, i) => {
            html += `<th style="text-align:${alignments[i] || 'left'}">${inlineFormat(h)}</th>`;
          });
          html += '</tr></thead><tbody>';
          bodyLines.forEach(row => {
            const cells = row.split('|').slice(1, -1);
            html += '<tr>';
            cells.forEach((c, i) => {
              html += `<td style="text-align:${alignments[i] || 'left'}">${inlineFormat(c.trim())}</td>`;
            });
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          output.push(html);
          inTable = false;
          tableRows = [];
        } else if (inTable) {
          tableRows.forEach(r => output.push(inlineFormat(r) + '<br>'));
          inTable = false;
          tableRows = [];
        }
      }

      function inlineFormat(str) {
        return str
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
          .replace(/\*(.*?)\*/g, '<i>$1</i>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        const line = rawLine.trim();

        // 检查代码块标记
        const codeMatch = line.match(/^%%CODE_BLOCK_(\d+)%%$/);
        if (codeMatch) {
          flushList();
          flushTable();
          const codeContent = codeBlocks[parseInt(codeMatch[1], 10)]
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          output.push(`<pre><code>${codeContent}</code></pre>`);
          continue;
        }

        // 检查表格行
        if (line.startsWith('|') && line.endsWith('|')) {
          flushList();
          inTable = true;
          tableRows.push(line);
          continue;
        } else {
          flushTable();
        }

        // 检查列表项
        if (line.startsWith('- ')) {
          if (!inList) {
            output.push('<ul>');
            inList = true;
          }
          output.push(`<li>${inlineFormat(line.substring(2))}</li>`);
          continue;
        } else {
          flushList();
        }

        // 检查标题与引用
        if (line.startsWith('# ')) {
          output.push(`<h1>${inlineFormat(line.substring(2))}</h1>`);
        } else if (line.startsWith('## ')) {
          output.push(`<h2>${inlineFormat(line.substring(3))}</h2>`);
        } else if (line.startsWith('### ')) {
          output.push(`<h3>${inlineFormat(line.substring(4))}</h3>`);
        } else if (line.startsWith('#### ')) {
          output.push(`<h4>${inlineFormat(line.substring(5))}</h4>`);
        } else if (line.startsWith('> ')) {
          output.push(`<blockquote>${inlineFormat(line.substring(2))}</blockquote>`);
        } else if (line === '---' || line === '***') {
          output.push('<hr>');
        } else if (line === '') {
          output.push('<br>');
        } else {
          output.push(`<p>${inlineFormat(line)}</p>`);
        }
      }

      flushList();
      flushTable();

      preview.innerHTML = output.join('\n');
    }

    // 手动保存
    function manualSave() {
      localStorage.setItem(STORAGE_KEY, editor.value);
      showToast('文档已成功保存到本地存储！');
    }

    // 复制全文
    function copyDocument() {
      navigator.clipboard.writeText(editor.value).then(() => {
        showToast('已成功复制需求文档全文到剪贴板！');
      });
    }

    // 导出 .md 文件
    function exportMarkdown() {
      const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `点阵屏项目_需求规格说明书_${Date.now()}.md`;
      link.click();
      showToast('已成功导出 Markdown 文件！');
    }

    // 恢复默认模板
    function resetToDefaultTemplate() {
      if (confirm('确定要恢复为初始默认的需求模板吗？当前修改将会被覆盖。')) {
        editor.value = DEFAULT_TEMPLATE;
        localStorage.setItem(STORAGE_KEY, DEFAULT_TEMPLATE);
        updateWordCount();
        renderMarkdown();
        showToast('已恢复初始默认模板！');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    init();
  </script>
</body>
</html>
