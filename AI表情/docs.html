> **文档版本**：v2.0.0 (全量增强版)

## 1. 项目概述与核心目标

本项目专为 **393 颗高密圆形物理点阵屏**（23×23 对称圆阵，间距 0.16mm）研发。突破传统点阵屏单调刻板的图案限制，融合了 **x.ai Grok 灵动球的 3D 视线与连续流体动力学**，并拓展为涵盖 **表情、系统、活动、生活、游戏、氛围** 六大核心品类的全场景点阵交互系统。

### 核心设计目标
1. **极致物理仿真**：精准对应 0707CSP 物理芯片尺寸与间距，真实模拟荧光辉光（Bloom）与铝基底板引线槽。
2. **多维动画体系**：不仅涵盖高灵动度的 AI 仿生表情球，更囊括时钟、仪表、运动、天气、街机游戏等实用与趣味动画。
3. **即时编辑与交付**：网页自带在线需求文档系统（即改即存），并能直接导出 50 字节 C 语言单片机数组，无缝对接嵌入式研发。

- **灯珠中心间距 (Pitch)**：0.16 mm
- **物理发光总点数**：**393 颗 (PCS)**
- **对齐基准点**：以 (11, 11) 为物理中心绝对原点，所有圆心与旋转均基于此原点。

## 3. 各分类详细规划清单

系统划分为 **6 大核心主分类**，右侧操作面板支持一级分类切换与二级胶囊筛选：

### 3.1 🤖 【表情分类】（Avatar & Expressions）
*依托 3D 头部姿态旋转（Yaw/Pitch/Roll）与双眼投影距离场采样：*

#### 3.1.1 情绪表情（16 种核心情绪）
1. **平静 · NEUTRAL (neutre)**：默认稳态，微小视线游走，轻柔自主呼吸。
2. **专注 · FOCUS (attentif)**：双眼微聚，头部微倾，视线笔直注视前方。
3. **惊讶 · SURPRISE (surpris)**：双眼纵向瞬间拉伸变大，视线微微上扬。
4. **兴奋 · EXCITED (excite)**：双眼饱满微斜，灵动充满好奇与活力。
5. **开心 · HAPPY (heureux)**：眼角微弯，上扬弧线，温和笑意。
6. **大笑 · LAUGH (hilare)**：眼睑深度闭合至弯月月牙弧线，极具感染力。
7. **生气 · ANGRY (colere)**：双眼呈倒八字倾斜，眼神严肃威严。
8. **难过 · SAD (triste)**：双眼呈正八字向外下垂，视线略微低落。
9. **害怕 · FEAR (effraye)**：双眼圆睁，高频微幅震颤抖动。
10. **怀疑 · SKEPTIC (mefiant)**：单眼挑眉微眯，左右眼呈现不对称开合。
11. **困惑 · CONFUSED (confus)**：双眼角度反向不对称倾斜，头部略微偏转。
12. **好奇 · CURIOUS (curieux)**：头部明显侧倾，眼眸大而清亮。
13. **得意 · PROUD (fier)**：双眼微抬，充满自信轻盈神采。
14. **羞怯 · SHY (timide)**：双眼缩小下移，视线下垂腼腆。
15. **无趣 · BORED (blase)**：半闭眼睑，视线转向一侧略显倦怠。
16. **困倦 · SLEEPY (somnolent)**：上眼睑缓慢下垂打瞌睡，忽醒忽合。

#### 3.1.2 动作状态与几何形变（14 种连续循环）
1. **待机呼吸 (idle)**：球体周期性轻微伸缩（周期约 3.4s），伴随自然随机眨眼。
2. **思考沉思 (thinking)**：双眼凝视右上角，有节奏沉吟。
3. **俏皮眨眼 (wink)**：单眼保持常睁，另一眼俏皮眨动。
4. **睁大双眼 (wide)**：眼部蓦然放大，四顾巡视后恢复。
5. **警觉凝视 (alert)**：头部左右快速巡视，保持高度警惕。
6. **消息提示 (notify)**：球体右上边缘凹陷并弹出一枚高亮通知光斑（-42° 边缘角）。
7. **感叹唤醒 (exclaim)**：双眼融合变形为一枚竖向跳跃的感叹号「!」。
8. **深度睡眠 (sleep)**：双眼闭合为平直静止虚线，呼吸频率放缓。
9. **椭圆律动 (egg)**：球体轮廓横向压缩、纵向拉伸呈光滑鹅蛋卵形。
10. **六边晶格 (hexagon)**：外围轮廓渐变为带有圆角的规则六边形。
11. **趣味弹跳 (play)**：球体中心高频上下轻微跳跃，充满弹性阻尼感。
12. **行星环绕 (orbit)**：多道倾斜三维光环自后向前环绕球体高速旋转。
13. **粒子爆发 (burst)**：球体核心向内坍缩后轰然炸散为微光粒子，随后聚拢重组。
14. **彗星飞掠 (comet)**：球体拖拽多道长弧形高速拖尾流光穿过夜空。

#### 3.1.3 灵动眼眸与符号表情
- **触电电眼 (EYE_SHOCK)**：闪电折线形发光眼眸，极具二次元张力。
- **弯月笑眼 (EYE_GRIN)**：极简圆弧弧线笑眼。
- **情绪双眸 (EYES)**：多段形态动态变换大眼。
- **心情变换 (MOOD)**：开心/严肃/难过连贯切换。
- **心意爱心 (HEART) & 心跳回响 (HEARTBEAT)**：心形轮廓跳动与脉冲扩散。

### 3.2 ⚙️ 【系统分类】（System & Hardware）
*硬件状态与系统环境的可视化信息呈现：*

#### 3.2.1 时间日历
- **数字时间 (CLOCK)**：上下双层垂直时钟排布（上层 2 位小时，下层 2 位分钟），专为圆形屏优化，带冒号闪烁。
- **双层日期 (DATE)**：上层显示月份（如 07月），下层显示具体日期数字（如 01日）。
- **星期显示 (WEEKDAY)**：周一至周日独立指示方块与当前星期流转点亮。

#### 3.2.2 硬件与仪表
- **电量百分比 (BATTERY)**：中心显示两排大字电量数值（如 \`20%\`、\`85%\`），外圈根据电量动态填充圆环。
- **充电流光 (CHARGE)**：高亮粒子自外围同心圆环向中心电量符号持续汇聚流动。
- **立体音量柱 (VOLUME)**：阶梯式点阵声级柱，随音量滑块增减平滑升降。
- **环境温度计 (TEMP)**：大字显示温度数值并附带右上角物理摄氏度圆圈符号 \`°\`。

#### 3.2.3 传感与网络
- **星罗盘指南针 (COMPASS)**：360° 旋转指针，精准随偏航角角度实时旋转指向南北方位。
- **全向雷达扫描 (RADAR)**：同心圆网格背景下，一道高亮扫描线逆时针匀速扫描旋转。
- **蓝牙连接 (BLUETOOTH)**：经典蓝牙符文天线闪烁配对波纹。
- **能量环流 (ENERGY_RING)**：闭环粒子流沿圆盘外沿持续旋转充能。

---

### 3.3 🏃 【活动分类】（Activity & Fitness）
*运动健康打卡与个人专注效率：*

#### 3.3.1 运动健康
- **动感奔跑者 (RUNNER)**：动态逐帧跑步运动小人，四肢协调摆动。
- **万步达成 (STEPS)**：步数奖杯勋章，伴随闪烁光芒粒子。
- **健身律动 (WORKOUT)**：力量健身动作循环。
- **跃动小人 (PERSON)**：全身站立、跳跃动效。

#### 3.3.2 专注效率
- **时砂专注 (FOCUS)**：专注倒计时数字与外围倒计时进度环。
- **沙漏倒计时 (SAND)**：逼真点阵沙漏，上方沙粒逐颗坠落至下方堆积。
- **三排矩阵进度条 (PROGRESS)**：三段分段式进度条流水线推进。
- **任务完成确认 (SUCCESS)**：圆环内部打出明亮对勾（Checkmark）。
- **邮件到达 (MAIL)**：信封自一侧飞入并在中央展开提示。

---

### 3.4 ☕ 【生活分类】（Daily Life & Nature）
*气象、声浪与日常生活情调：*

#### 3.4.1 气象万千
- **阳光晴天 (SUNNY)**：中央耀斑配合 8 道旋转光芒指针。
- **浮云飘拂 (CLOUDY)**：饱满云朵在圆屏微风中自左向右缓慢漂浮。
- **雨滴涟漪 (RAINY)**：细雨倾斜而下，底部溅起水花涟漪。
- **像素落雨 (RAIN)**：黑客帝国式垂直矩阵雨滴滑落。
- **冬日落雪 (SNOW)**：旋转的六角雪花慢速旋转飘摇。
- **雷暴闪电 (STORM)**：乌云内部突然劈裂明亮折线电光。

#### 3.4.2 影音与日常

## 4. 网页功能与用户界面 (UI/UX) 要求

采用 **工业级暗黑三栏工作区架构**（响应式自适应屏幕宽度）：

   - 核心功能外链：**「📝 需求说明文档」**（新标签页独立开启）、GitHub 源码外链、线上部署外链。
2. **左侧参数与控制栏 (Sidebar Left)**：

   - LED 调色板（6 款硬件经典色系 + HTML5 取色器）
   - 物理发光强度（20%~100%）与荧光光晕扩散（Bloom 0~30px）调节

3. **中央核心舞台视窗 (Center Stage)**：
   - 顶部状态标签：展示当前播放动画所属一级分类、中文名称与标识
   - 视图切换按钮：支持「双模并列对比」、「仅 393 点阵屏」、「仅矢量连续」

   - 原版矢量 SVG 连续动作对比视窗

## 5. 嵌入式单片机数据接口规范

1. **50 字节紧凑位图数组 (C Language Bitmap)**：

    const STORAGE_KEY = 'DOT_MATRIX_PROJECT_DOCS_CONTENT_V3';
    const editor = document.getElementById('docEditor');
    const preview = document.getElementById('docPreview');
    const wordCount = document.getElementById('wordCount');

    // 初始化内容
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      editor.value = saved || DEFAULT_TEMPLATE;
      updateWordCount();
      renderMarkdown();

      // 实时自动保存监听
      editor.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY, editor.value);
        updateWordCount();
        renderMarkdown();
        showAutoSaveStatus();
      });
    }

    function updateWordCount() {
      wordCount.textContent = `字数: ${editor.value.length}`;
    }

    function showAutoSaveStatus() {
      const el = document.getElementById('saveStatusText');
      el.textContent = '已自动保存';
      setTimeout(() => { el.textContent = '已实时自动保存'; }, 1500);
    }

    // 模式切换
    function setMode(mode) {
      document.getElementById('btnEditMode').classList.toggle('active', mode === 'edit');
      document.getElementById('btnPreviewMode').classList.toggle('active', mode === 'preview');

      if (mode === 'edit') {
        editor.style.display = 'block';
        preview.style.display = 'none';
      } else {
        renderMarkdown();
        editor.style.display = 'none';
        preview.style.display = 'block';
      }
    }

    // 轻量级原生 Markdown 解析器
    function renderMarkdown() {
      const text = editor.value;
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
        .replace(/\*(.*?)\*/gim, '<i>$1</i>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        .replace(new RegExp('<li>[\\s\\S]*?<\\/li>', 'gim'), (m) => '<ul>' + m + '</ul>')
        .replace(/\n/g, '<br>');

      preview.innerHTML = html;
    }

    // 手动保存
    function manualSave() {
      localStorage.setItem(STORAGE_KEY, editor.value);
      showToast('文档已成功保存到本地存储！');
    }

    // 复制全文
    function copyDocument() {
      navigator.clipboard.writeText(editor.value).then(() => {
        showToast('已成功复制需求文档全文到剪贴板！');
      });
    }

    // 导出 .md 文件
    function exportMarkdown() {
      const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `点阵屏项目_需求规格说明书_${Date.now()}.md`;
      link.click();
      showToast('已成功导出 Markdown 文件！');
    }

    // 恢复默认模板
    function resetToDefaultTemplate() {
      if (confirm('确定要恢复为初始默认的需求模板吗？当前修改将会被覆盖。')) {
        editor.value = DEFAULT_TEMPLATE;
        localStorage.setItem(STORAGE_KEY, DEFAULT_TEMPLATE);
        updateWordCount();
        renderMarkdown();
        showToast('已恢复初始默认模板！');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    init();
  </script>
